<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 120 775 520" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Nexus</title>
  <!-- A globe holding a small network, inside a fixed ring. The globe and its grid (#globe, #globe_cage)
       are the parts src/logoGaze.js moves to follow the pointer. -->
  <circle id="ring" cx="567.5" cy="380" r="245" fill="#4454727a" stroke="#48b" stroke-width="10" />
  <circle id="inner_ring" cx="567.5" cy="380" r="212" fill="none" stroke="#00f6ff" stroke-width="4" />
  <g id="globe" fill="none" stroke="#00f6ff" stroke-linecap="round" stroke-width="7">
    <circle cx="567.5" cy="380" r="120" />
    <path d="M515 335L625 365L560 435Z" stroke-width="5" />
    <g fill="#00f6ff" stroke="none">
      <circle cx="515" cy="335" r="14" />
      <circle cx="625" cy="365" r="14" />
      <circle cx="560" cy="435" r="14" />
    </g>
  </g>
  <g id="globe_cage" fill="none" stroke="#fff" stroke-width="3" opacity="0.55">
    <ellipse cx="567.5" cy="380" rx="55" ry="120" />
    <ellipse cx="567.5" cy="380" rx="120" ry="45" />
    <path d="M447.5 380H687.5" />
  </g>
</svg>
